<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <title>Neural Ink · EMNIST Handwriting Recogniser</title>
    <meta
      name="description"
      content="Draw or upload a handwritten digit or letter and let EMNISTNet CNN — powered by PyTorch — identify it in milliseconds. 47 classes, EMNIST Balanced dataset."
    />

    <meta property="og:title"       content="Neural Ink · EMNIST Recogniser" />
    <meta property="og:description" content="Handwritten digit & letter recognition powered by PyTorch." />
    <meta property="og:type"        content="website" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #f6f8fa;
        color: #1f2328;
        font-family: 'DM Sans', system-ui, sans-serif;
        min-height: 100dvh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100dvh; }

      .app-skeleton {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        gap: 12px;
        color: #9ca3af;
        font-size: 0.875rem;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
      }
      .app-skeleton-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #06b6d4;
        animation: skDot 1.2s ease-in-out infinite both;
      }
      .app-skeleton-dot:nth-child(2) { animation-delay: 0.18s; background: #10b981; }
      .app-skeleton-dot:nth-child(3) { animation-delay: 0.36s; background: #eab308; }
      @keyframes skDot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40%           { transform: scale(1.0); opacity: 1;   }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-skeleton">
        <div style="display:flex;gap:6px;margin-bottom:4px;">
          <span class="app-skeleton-dot"></span>
          <span class="app-skeleton-dot"></span>
          <span class="app-skeleton-dot"></span>
        </div>
        Loading Neural Ink…
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
